name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .
      - name: shellcheck
        run: shellcheck scripts/*.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -v
      - name: CLI smoke test
        run: |
          planguard --version
          planguard rules
          planguard analyze tests/fixtures/safe.json
          if planguard analyze tests/fixtures/rds_replace.json > /dev/null; then
            echo "expected exit 1 for a CRITICAL plan"; exit 1
          fi
