  <rect width="512" height="512" rx="112" fill="url(#pg-bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#30363d" stroke-width="4"/>
  <g transform="translate(256 256) scale(1.12) translate(-256 -238)">
