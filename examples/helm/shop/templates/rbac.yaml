apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-ops
  labels: {{- include "shop.labels" . | nindent 4 }}
{{- if .Values.rbac.clusterAdmin }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-ops-admin
  labels: {{- include "shop.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-ops
    namespace: {{ .Release.Namespace }}
{{- end }}
