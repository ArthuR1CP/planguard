apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels: {{- include "shop.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: {{ .Values.web.image }}
          ports: [{containerPort: 80}]
        {{- if .Values.web.debugSidecar }}
        - name: debug
          image: busybox:1.36
          command: ["sleep", "infinity"]
          securityContext:
            privileged: true
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
  labels: {{- include "shop.labels" . | nindent 4 }}
spec:
  type: {{ .Values.web.serviceType }}
  selector: {app: web}
  ports: [{port: 80, targetPort: 80}]
